<!DOCTYPE html>
<html lang="en">
<head>

    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve on iOS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- Set the theme before first paint to avoid a light flash -->
    <script>
        (function () {
            var t = localStorage.getItem('theme-preference') ||
                    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-bs-theme', t);
        })();
    </script>

    <title>Kain Tayo | What should we eat?</title>
    <meta name="description" content="Can't decide what to eat? Kain Tayo randomly suggests Filipino and international meals.">
    <meta name="theme-color" content="#FBF7F1">

    <meta property="og:title" content="Kain Tayo | What should we eat?">
    <meta property="og:description" content="Can't decide what to eat? Kain Tayo randomly suggests Filipino and international meals.">
    <!-- Open Graph needs absolute URLs -->

    <meta property="og:image" content="https://charles-lao.github.io/kain-tayo/icons/icon-512.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">

    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48"/>
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Kain Tayo">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>

    <a class="skip-link" href="#main">Skip to content</a>

    <header class="app-header">
        <a class="wordmark" href="index.html">
            <svg class="wordmark-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                <rect width="100" height="100" rx="24" fill="#C4451F"/>
                <circle cx="50" cy="50" r="33" fill="#FBF7F1"/>
                <circle cx="37" cy="37" r="5.4" fill="#C4451F"/>
                <circle cx="63" cy="37" r="5.4" fill="#C4451F"/>
                <circle cx="37" cy="63" r="5.4" fill="#C4451F"/>
                <circle cx="63" cy="63" r="5.4" fill="#C4451F"/>
                <circle cx="50" cy="50" r="6.6" fill="#E0B84A"/>
            </svg>Kain Tayo<span class="wordmark-dot">.</span>
        </a>

        <nav class="desktop-nav" aria-label="Main">
            <a class="nav-link-pill active" aria-current="page" href="index.html">Home</a>
            <a class="nav-link-pill" href="list.html">Browse</a>
            <a class="nav-link-pill" href="saved-meals.html">Saved</a>
        </nav>

        <div class="header-actions">
            <button type="button" id="theme-toggle" class="icon-btn" aria-label="Switch to dark theme">
                <i class="bi bi-moon-stars-fill" aria-hidden="true"></i>
            </button>
        </div>
    </header>

    <main id="main" class="page page--narrow">

        <section class="hero">
            <span class="hero-kicker">Gutom ka na?</span>
            <!-- Space before the <br> so the accessible name isn't "shouldwe" -->
            <h1 class="hero-title">What should <br>we eat today?</h1>
            <p class="hero-sub">Tap the dice and let Kain Tayo decide, from home-cooked ulam to takeaway.</p>

            <div class="hero-actions">
                <button id="random-btn" class="btn btn-brand btn-dice flex-grow-1">
                    <span class="dice" aria-hidden="true">🎲</span> <span class="btn-label">Suggest a meal</span>
                </button>
                <button id="filter-btn" class="icon-btn icon-btn--outline icon-btn--lg" type="button"
                        data-bs-toggle="offcanvas" data-bs-target="#filter-sheet"
                        aria-label="Filters">
                    <i class="bi bi-sliders2-vertical" aria-hidden="true"></i>
                    <span id="filter-dot" class="dot-indicator d-none"></span>
                </button>
            </div>
        </section>

        <div id="random-meal" aria-live="polite">
            <div id="meal-skeleton" class="meal-hero d-none" aria-hidden="true">
                <div class="skeleton skeleton-media"></div>
                <div class="meal-hero-body">
                    <div class="skeleton skeleton-line" style="width:60%"></div>
                    <div class="skeleton skeleton-line" style="width:35%;height:0.75rem"></div>
                    <div class="skeleton" style="height:48px;border-radius:10px"></div>
                </div>
            </div>
            <p id="loading-status" class="visually-hidden">Picking a meal…</p>
            <div id="meal-card"></div>
        </div>

    </main>

    <div class="offcanvas offcanvas-bottom filter-sheet" tabindex="-1" id="filter-sheet"
         aria-labelledby="filter-sheet-title">
        <div class="offcanvas-header">
            <h2 class="offcanvas-title h5 mb-0" id="filter-sheet-title">Filters</h2>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div class="mb-4">
                <span class="filter-label" id="cat-label">Categories</span>
                <div id="category-chips" class="chip-group" role="group" aria-labelledby="cat-label"></div>
            </div>
            <div class="mb-4">
                <span class="filter-label" id="type-label">Meal types</span>
                <div id="type-chips" class="chip-group" role="group" aria-labelledby="type-label"></div>
            </div>
            <hr class="hairline">
            <div class="d-flex align-items-center justify-content-between gap-2">
                <span class="result-count" id="match-count" aria-live="polite"></span>
                <button type="button" id="clear-filters" class="btn btn-quiet btn-sm">Clear all</button>
            </div>
        </div>
    </div>

    <nav class="tabbar" aria-label="Main">
        <a class="tabbar-item active" aria-current="page" href="index.html">
            <span class="tab-icon-wrap"><i class="bi bi-house-door-fill" aria-hidden="true"></i></span>
            Home
        </a>
        <a class="tabbar-item" href="list.html">
            <span class="tab-icon-wrap"><i class="bi bi-grid" aria-hidden="true"></i></span>
            Browse
        </a>
        <a class="tabbar-item" href="saved-meals.html">
            <span class="tab-icon-wrap">
                <i class="bi bi-bookmark-fill" aria-hidden="true"></i>
            </span>
            Saved <span class="tab-count savedMealsCount" hidden>0</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/layout.js"></script>

    <script>
    let meals = [];

    MealDataService.getMeals().then(async data => {
        meals = data;
        await MealFilters.init(updateFilterState);
        updateFilterState();
    });

    function getFilteredMeals() {
        return meals.filter(meal => MealFilters.matches(meal));
    }

    /** Keep the dot, the live match count and the Clear button in sync. */
    function updateFilterState() {
        const total = MealFilters.activeCount();
        document.getElementById('filter-dot').classList.toggle('d-none', total === 0);

        const count = getFilteredMeals().length;
        const noun = count === 1 ? 'meal' : 'meals';
        const verb = total === 0 ? 'available' : (count === 1 ? 'matches' : 'match');
        document.getElementById('match-count').innerHTML =
            `<strong>${count}</strong> ${noun} ${verb}`;

        document.getElementById('clear-filters').disabled = total === 0;
    }

    // The last few suggestions, newest first, so re-rolls don't repeat.
    const RECENT_KEY = 'recentSuggestions';
    const RECENT_LIMIT = 5;
    // Old single-ID key, replaced by RECENT_KEY in v6. Safe to delete later.
    localStorage.removeItem('lastSuggestedMealId');

    function getRecentIds() {
        try {
            const ids = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
            return Array.isArray(ids) ? ids : [];
        } catch (e) {
            return [];
        }
    }

    /**
     * Pick a random meal, skipping as many recent suggestions as the pool
     * allows while always leaving one. Small pools then rotate through every
     * meal before repeating.
     */
    function pickMeal(pool) {
        const recent = getRecentIds();
        const poolIds = new Set(pool.map(m => String(m.id)));
        const skip = recent.filter(id => poolIds.has(id)).slice(0, pool.length - 1);
        const candidates = pool.filter(m => !skip.includes(String(m.id)));

        const meal = candidates[Math.floor(Math.random() * candidates.length)];
        const id = String(meal.id);
        const updated = [id, ...recent.filter(r => r !== id)].slice(0, RECENT_LIMIT);
        localStorage.setItem(RECENT_KEY, JSON.stringify(updated));
        return meal;
    }

    function suggestMeal() {
        if (!meals.length) return;

        const skeleton = document.getElementById('meal-skeleton');
        const mealCard = document.getElementById('meal-card');

        mealCard.innerHTML = '';
        skeleton.classList.remove('d-none');
        document.getElementById('loading-status').textContent = 'Picking a meal…';

        setTimeout(() => {
            const filteredMeals = getFilteredMeals();

            if (!filteredMeals.length) {
                skeleton.classList.add('d-none');
                // Restore the full hero above the empty state.
                setSuggestionState(false);
                mealCard.innerHTML = `
                    <div class="empty-state">
                        <span class="empty-icon"><i class="bi bi-funnel" aria-hidden="true"></i></span>
                        <h2>Walang match</h2>
                        <p>No meals fit those filters. Try loosening them a bit.</p>
                        <button type="button" class="btn btn-quiet" data-bs-toggle="offcanvas"
                                data-bs-target="#filter-sheet">Adjust filters</button>
                    </div>`;
                document.getElementById('loading-status').textContent = 'No meals match the selected filters.';
                return;
            }

            renderMeal(pickMeal(filteredMeals), skeleton, mealCard);
        }, 280);
    }

    /**
     * Once a meal is shown, collapse the hero to the dice row so the card fits
     * above the fold, and relabel the dice button for re-rolls.
     * @param {boolean} active
     */
    function setSuggestionState(active) {
        document.body.classList.toggle('has-suggestion', active);
        document.querySelector('#random-btn .btn-label').textContent =
            active ? 'Suggest another' : 'Suggest a meal';
    }

    /**
     * Render the card without waiting for the photo. Waiting on img.onload left
     * a slow image stuck on the skeleton.
     */
    function renderMeal(meal, skeleton, mealCard) {
        skeleton.classList.add('d-none');
        document.getElementById('loading-status').textContent = `Suggested: ${meal.name}`;

        const isSaved = MealManager.isMealSaved(meal.id);
        const mapsBtn = MealDataService.getMapsButtonHtml(meal, 'hero');
        const name = escapeHtml(meal.name);

        mealCard.innerHTML = `
            <article class="meal-hero slide-up">
                <div class="meal-hero-media">
                    <img src="${escapeHtml(meal.image)}" alt="${name}"
                         class="fullscreen-img-modal" decoding="async"
                         onerror="this.onerror=null;this.src='images/food-placeholder.png';">
                    <h2 class="meal-hero-name">${name}</h2>
                </div>
                <div class="meal-hero-body">
                    <div class="cat-row">${MealDataService.getCategoryBadgesHtml(meal)}</div>
                    <div class="d-grid gap-2">
                        <button type="button" id="addMealBtn"
                                data-meal-name="${name}"
                                data-meal-id="${escapeHtml(meal.id)}"
                                class="btn ${isSaved ? 'btn-saved' : 'btn-quiet'}">
                            <i class="bi ${isSaved ? 'bi-bookmark-check-fill' : 'bi-bookmark'}" aria-hidden="true"></i>
                            <span class="save-label">${isSaved ? 'Saved' : 'Save meal'}</span>
                        </button>
                        ${mapsBtn}
                    </div>
                </div>
            </article>`;

        attachZoom(mealCard.querySelector('img'));

        setSuggestionState(true);
    }

    function setHeroSaved(btn, saved) {
        btn.classList.toggle('btn-saved', saved);
        btn.classList.toggle('btn-quiet', !saved);
        btn.querySelector('i').className = `bi ${saved ? 'bi-bookmark-check-fill' : 'bi-bookmark'}`;
        btn.querySelector('.save-label').textContent = saved ? 'Saved' : 'Save meal';
    }

    document.getElementById('random-btn').addEventListener('click', suggestMeal);

    document.getElementById('meal-card').addEventListener('click', e => {
        const btn = e.target.closest('#addMealBtn');
        if (!btn) return;
        MealManager.toggleWithUndo(btn.dataset.mealId, btn.dataset.mealName,
            saved => setHeroSaved(btn, saved));
    });
    </script>

    <script src="js/sw-register.js"></script>
    <script src="js/install.js"></script>

</body>
</html>
