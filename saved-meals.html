<!DOCTYPE html>
<html lang="en">
<head>

        (function () {
            var t = localStorage.getItem('theme-preference') ||
                    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-bs-theme', t);
        })();
    </script>

    <title>Kain Tayo | Saved meals</title>
    <meta name="description" content="Your saved meals in Kain Tayo.">
    <meta name="theme-color" content="#FBF7F1">

    <meta property="og:title" content="Kain Tayo | Saved meals">
    <meta property="og:description" content="Your saved meals in Kain Tayo.">
    <!-- Open Graph needs absolute URLs -->
    <meta property="og:url" content="https://charles-lao.github.io/kain-tayo/saved-meals.html">
    <meta property="og:image" content="https://charles-lao.github.io/kain-tayo/icons/icon-512.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">

    <!-- From here to </head> is identical in index.html, list.html and saved-meals.html. Change all three. -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48"/>
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Kain Tayo">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <a class="skip-link" href="#main">Skip to content</a>

    <header class="app-header">
        <a class="wordmark" href="index.html">
            <svg class="wordmark-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                <rect width="100" height="100" rx="24" fill="#C4451F"/>
                <circle cx="50" cy="50" r="33" fill="#FBF7F1"/>
                <circle cx="37" cy="37" r="5.4" fill="#C4451F"/>
                <circle cx="63" cy="37" r="5.4" fill="#C4451F"/>
                <circle cx="37" cy="63" r="5.4" fill="#C4451F"/>
                <circle cx="63" cy="63" r="5.4" fill="#C4451F"/>
                <circle cx="50" cy="50" r="6.6" fill="#E0B84A"/>
            </svg>Kain Tayo<span class="wordmark-dot">.</span>
        </a>

        <nav class="desktop-nav" aria-label="Main">
            <a class="nav-link-pill" href="index.html">Home</a>
            <a class="nav-link-pill" href="list.html">Browse</a>
            <a class="nav-link-pill active" aria-current="page" href="saved-meals.html">Saved</a>
        </nav>

        <div class="header-actions">
            <button type="button" id="theme-toggle" class="icon-btn" aria-label="Switch to dark theme">
                <i class="bi bi-moon-stars-fill" aria-hidden="true"></i>
            </button>
        </div>
    </header>

    <main id="main" class="page">

        <div class="page-head">
            <h1 class="page-title">Saved meals</h1>
            <button type="button" id="clearAllBtn" class="btn btn-quiet btn-sm" hidden>
                <i class="bi bi-trash" aria-hidden="true"></i> Clear all
            </button>
        </div>

        <p class="result-count mb-3" id="result-count" aria-live="polite"></p>

        <div id="meal-grid" class="meal-grid"></div>
        <div id="grid-empty"></div>

    </main>

    <!-- Clear-all confirmation -->
    <div class="modal fade" id="clearModal" tabindex="-1" aria-labelledby="clearModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="clearModalTitle">Clear all saved meals?</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0 text-muted-ink">
                        This removes every meal from your saved list. You can undo it right after.
                    </p>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-quiet" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-brand" id="confirmClearBtn">Clear all</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="tabbar" aria-label="Main">
        <a class="tabbar-item" href="index.html">
            <span class="tab-icon-wrap"><i class="bi bi-house-door" aria-hidden="true"></i></span>
            Home
        </a>
        <a class="tabbar-item" href="list.html">
            <span class="tab-icon-wrap"><i class="bi bi-grid" aria-hidden="true"></i></span>
            Browse
        </a>
        <a class="tabbar-item active" aria-current="page" href="saved-meals.html">
            <span class="tab-icon-wrap">
                <i class="bi bi-bookmark-fill" aria-hidden="true"></i>
            </span>
            Saved <span class="tab-count savedMealsCount" hidden>0</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/layout.js"></script>

    <script>
    let meals = [];

    MealDataService.getMeals().then(data => {
        meals = data;
        displaySavedMeals();
    });

    function displaySavedMeals() {
        const grid = document.getElementById('meal-grid');
        const empty = document.getElementById('grid-empty');
        const count = document.getElementById('result-count');
        const clearBtn = document.getElementById('clearAllBtn');

        // Drop saved IDs whose meal is no longer in foods.json.
        const savedMeals = MealManager.getSavedMealIds()
            .map(id => meals.find(m => m.id.toString() === id.toString()))
            .filter(Boolean);

        if (!savedMeals.length) {
            grid.innerHTML = '';
            count.textContent = '';
            clearBtn.hidden = true;
            empty.innerHTML = `
                <div class="empty-state">
                    <span class="empty-icon"><i class="bi bi-bookmark" aria-hidden="true"></i></span>
                    <h2>No saved meals</h2>
                    <p>Meals you save will show up here, ready for the next time you can't decide.</p>
                    <a href="index.html" class="btn btn-brand">
                        <span aria-hidden="true">🎲</span> Get a suggestion
                    </a>
                </div>`;
            return;
        }

        empty.innerHTML = '';
        clearBtn.hidden = false;
        count.innerHTML = `<strong>${savedMeals.length}</strong> saved ${savedMeals.length === 1 ? 'meal' : 'meals'}`;
        grid.innerHTML = savedMeals.map(meal => MealGrid.tileHtml(meal, { action: 'remove' })).join('');
        attachZoom('.fullscreen-img-modal');
    }

    document.getElementById('meal-grid').addEventListener('click', e => {
        const btn = e.target.closest('.remove-meal-btn');
        if (!btn) return;
        // Another tab may have removed it already. Refresh instead of re-saving it.
        if (!MealManager.isMealSaved(btn.dataset.mealId)) return displaySavedMeals();
        MealManager.toggleWithUndo(btn.dataset.mealId, btn.dataset.mealName, displaySavedMeals);
    });

    document.getElementById('clearAllBtn').addEventListener('click', () => {
        bootstrap.Modal.getOrCreateInstance(document.getElementById('clearModal')).show();
    });

    document.getElementById('confirmClearBtn').addEventListener('click', () => {
        const previous = MealManager.clearAll();
        displaySavedMeals();
        bootstrap.Modal.getInstance(document.getElementById('clearModal')).hide();

        showMessageToast('Cleared all saved meals', 'warning', {
            label: 'Undo',
            onClick: () => {
                MealManager.replaceAll(previous);
                displaySavedMeals();
            }
        });
    });
    </script>

    <script src="js/sw-register.js"></script>
    <script src="js/install.js"></script>

</body>
</html>
