<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- Resolve the theme before first paint so dark-mode users never see a light flash -->
    <script>
        (function () {
            var t = localStorage.getItem('theme-preference') ||
                    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-bs-theme', t);
        })();
    </script>

    <title>Kain Tayo | Browse meals</title>
    <meta name="description" content="Browse every meal in Kain Tayo — Filipino and international, home-cooked, takeaway and dine-in.">
    <meta name="theme-color" content="#FBF7F1">

    <meta property="og:title" content="Kain Tayo — Browse meals">
    <meta property="og:description" content="Browse every meal in Kain Tayo — Filipino and international.">
    <meta property="og:image" content="icons/icon-512.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48"/>
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Kain Tayo">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <a class="skip-link" href="#main">Skip to content</a>

    <header class="app-header">
        <a class="wordmark" href="index.html">
            <svg class="wordmark-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                <rect width="100" height="100" rx="24" fill="#C4451F"/>
                <circle cx="50" cy="50" r="33" fill="#FBF7F1"/>
                <circle cx="37" cy="37" r="5.4" fill="#C4451F"/>
                <circle cx="63" cy="37" r="5.4" fill="#C4451F"/>
                <circle cx="37" cy="63" r="5.4" fill="#C4451F"/>
                <circle cx="63" cy="63" r="5.4" fill="#C4451F"/>
                <circle cx="50" cy="50" r="6.6" fill="#E0B84A"/>
            </svg>Kain Tayo<span class="wordmark-dot">.</span>
        </a>

        <nav class="desktop-nav" aria-label="Main">
            <a class="nav-link-pill" href="index.html">Home</a>
            <a class="nav-link-pill active" aria-current="page" href="list.html">Browse</a>
            <a class="nav-link-pill" href="saved-meals.html">Saved</a>
        </nav>

        <div class="header-actions">
            <button type="button" id="theme-toggle" class="icon-btn" aria-label="Switch to dark theme">
                <i class="bi bi-moon-stars-fill" aria-hidden="true"></i>
            </button>
        </div>
    </header>

    <main id="main" class="page">

        <div class="page-head">
            <h1 class="page-title">Browse meals</h1>
        </div>

        <div class="toolbar">
            <div class="search-field">
                <i class="bi bi-search" aria-hidden="true"></i>
                <label for="meal-search" class="visually-hidden">Search meals by name</label>
                <input type="search" id="meal-search" placeholder="Search meals…" autocomplete="off">
            </div>
            <button id="filter-btn" class="icon-btn" type="button"
                    data-bs-toggle="offcanvas" data-bs-target="#filter-sheet"
                    aria-label="Filters"
                    style="width:44px;height:44px;border:1px solid var(--hairline);background:var(--surface);flex-shrink:0;">
                <i class="bi bi-sliders2-vertical" aria-hidden="true"></i>
                <span id="filter-dot" class="dot-indicator d-none"></span>
            </button>
        </div>

        <p class="result-count mb-3" id="result-count" aria-live="polite"></p>

        <div id="meal-grid" class="meal-grid"></div>
        <div id="grid-empty"></div>

    </main>

    <!-- Filter bottom sheet — same chips and same localStorage key as Home -->
    <div class="offcanvas offcanvas-bottom filter-sheet" tabindex="-1" id="filter-sheet"
         aria-labelledby="filter-sheet-title">
        <div class="offcanvas-header">
            <h2 class="offcanvas-title h5 mb-0" id="filter-sheet-title">Filters</h2>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div class="mb-4">
                <span class="filter-label" id="cat-label">Categories</span>
                <div id="category-chips" class="chip-group" role="group" aria-labelledby="cat-label"></div>
            </div>
            <div class="mb-4">
                <span class="filter-label" id="type-label">Meal types</span>
                <div id="type-chips" class="chip-group" role="group" aria-labelledby="type-label"></div>
            </div>
            <hr class="hairline">
            <div class="d-flex justify-content-end">
                <button type="button" id="clear-filters" class="btn btn-quiet btn-sm">Clear all</button>
            </div>
        </div>
    </div>

    <nav class="tabbar" aria-label="Main">
        <a class="tabbar-item" href="index.html">
            <span class="tab-icon-wrap"><i class="bi bi-house-door" aria-hidden="true"></i></span>
            Home
        </a>
        <a class="tabbar-item active" aria-current="page" href="list.html">
            <span class="tab-icon-wrap"><i class="bi bi-grid-fill" aria-hidden="true"></i></span>
            Browse
        </a>
        <a class="tabbar-item" href="saved-meals.html">
            <span class="tab-icon-wrap">
                <i class="bi bi-bookmark-fill" aria-hidden="true"></i>
            </span>
            Saved <span class="tab-count savedMealsCount" hidden>0</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/layout.js"></script>

    <script>
    let meals = [];
    let activeFilters = { categories: [], types: [] };
    let searchTerm = '';

    $(document).ready(function () {
        MealDataService.getMeals().then(async data => {
            meals = data;

            const options = await MealDataService.getFilterOptions();

            const saved = localStorage.getItem('activeFilters');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    activeFilters.categories = parsed.categories || [];
                    activeFilters.types = parsed.types || [];
                } catch (e) {
                    console.warn('Ignoring malformed saved filters', e);
                }
            }

            renderChips('category-chips', options.categories, 'categories');
            renderChips('type-chips', options.types, 'types');
            render();
        });
    });

    function renderChips(containerId, options, groupKey) {
        document.getElementById(containerId).innerHTML = options.map(option => {
            const isActive = activeFilters[groupKey].includes(option);
            return `<button type="button" class="chip" aria-pressed="${isActive}"
                            data-group="${groupKey}" data-value="${escapeHtml(option)}">
                        ${escapeHtml(option)}
                    </button>`;
        }).join('');
    }

    /** Apply the chip filters and the search box together. */
    function getVisibleMeals() {
        const term = searchTerm.trim().toLowerCase();

        return meals.filter(meal => {
            if (term && !meal.name.toLowerCase().includes(term)) return false;

            const mealCats = MealDataService.splitField(meal.category);
            const mealTypes = MealDataService.splitField(meal.type);

            const categoryMatch = !activeFilters.categories.length ||
                                  activeFilters.categories.some(c => mealCats.includes(c));
            const typeMatch = !activeFilters.types.length ||
                              activeFilters.types.some(t => mealTypes.includes(t));

            return categoryMatch && typeMatch;
        });
    }

    function render() {
        const visible = getVisibleMeals();
        const grid = document.getElementById('meal-grid');
        const empty = document.getElementById('grid-empty');

        const activeCount = activeFilters.categories.length + activeFilters.types.length;
        document.getElementById('filter-dot').classList.toggle('d-none', activeCount === 0);
        document.getElementById('clear-filters').disabled = activeCount === 0;

        document.getElementById('result-count').innerHTML =
            `<strong>${visible.length}</strong> of ${meals.length} meals`;

        if (!visible.length) {
            grid.innerHTML = '';
            empty.innerHTML = `
                <div class="empty-state">
                    <span class="empty-icon"><i class="bi bi-search" aria-hidden="true"></i></span>
                    <h2>Walang nahanap</h2>
                    <p>Nothing matches that search or filter combination.</p>
                    <button type="button" class="btn btn-quiet" id="reset-all">Reset search &amp; filters</button>
                </div>`;
            return;
        }

        empty.innerHTML = '';
        grid.innerHTML = visible.map(meal => MealGrid.tileHtml(meal, { action: 'save' })).join('');
        attachZoom('.fullscreen-img-modal');
    }

    // Debounced so typing doesn't re-render 88 tiles on every keystroke
    let searchTimer;
    $('#meal-search').on('input', function () {
        const value = this.value;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            searchTerm = value;
            render();
        }, 180);
    });

    $(document).on('click', '.chip', function () {
        const group = this.dataset.group;
        const value = this.dataset.value;
        const nowActive = this.getAttribute('aria-pressed') !== 'true';

        this.setAttribute('aria-pressed', String(nowActive));
        if (nowActive) {
            activeFilters[group].push(value);
        } else {
            activeFilters[group] = activeFilters[group].filter(v => v !== value);
        }

        localStorage.setItem('activeFilters', JSON.stringify(activeFilters));
        render();
    });

    function clearFilters() {
        activeFilters = { categories: [], types: [] };
        localStorage.setItem('activeFilters', JSON.stringify(activeFilters));
        document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
        render();
    }

    $('#clear-filters').on('click', clearFilters);

    $(document).on('click', '#reset-all', function () {
        document.getElementById('meal-search').value = '';
        searchTerm = '';
        clearFilters();
    });

    $(document).on('click', '.saveMealBtn', function () {
        const btn = this;
        const mealId = btn.dataset.mealId;
        const mealName = btn.dataset.mealName;

        if (MealManager.isMealSaved(mealId)) {
            const index = MealManager.removeMeal(mealId);
            MealGrid.setSavedState(btn, false);
            showMessageToast(`Removed ${mealName}`, 'warning', {
                label: 'Undo',
                onClick: () => {
                    MealManager.restoreMeal(mealId, index);
                    MealGrid.setSavedState(btn, true);
                }
            });
        } else if (MealManager.addMeal(mealId)) {
            MealGrid.setSavedState(btn, true);
            showMessageToast(`Saved ${mealName}`, 'success');
        }
    });
    </script>

    <script src="js/sw-register.js"></script>
    <script src="js/install.js"></script>

</body>
</html>
